[project]
name = "imc-image-converter"
version = "0.0.2"
description = "Fast, simple image format conversion for files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["black==26.5.1", "pytest"]

[project.scripts]
imc = "cli.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]
